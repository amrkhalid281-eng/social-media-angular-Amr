<aside class="h-fit xl:sticky mb-3 xl:top-[84px]">
  <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <div class="xl:mb-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-users text-[#1877f2]"
          aria-hidden="true"
        >
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
          <path d="M16 3.128a4 4 0 0 1 0 7.744"></path>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
          <circle cx="9" cy="7" r="4"></circle>
        </svg>
        <h3 class="text-base font-extrabold text-slate-900">Suggested Friends</h3>
      </div>
      <div class="flex gap-2">
        <span class="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-bold text-slate-600">{{suggestionsData().length}}</span>
        <p 
          (click)="toggel()"
          class="xl:hidden text-sm font-bold text-blue-500 cursor-pointer"
        >
          {{isOpen()?'Hide':'View'}}
        </p>
      </div>
    </div>
    <div
      [class.hidden]="!isOpen()"
      class="xl:block"
    >
      <div class="my-3 xl:mb-3">
        <label class="relative block">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-search pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"
            aria-hidden="true"
          >
            <path d="m21 21-4.34-4.34"></path>
            <circle cx="11" cy="11" r="8"></circle>
          </svg>
          <input
            placeholder="Search friends..."
            class="w-full rounded-xl border border-slate-200 bg-slate-50 py-2 pl-9 pr-3 text-sm text-slate-700 outline-none focus:border-[#1877f2] focus:bg-white"
            value=""
          />
        </label>
      </div>
      <div class="space-y-3">
        @for (item of suggestionsData(); track item._id) {
          <div class="rounded-xl border border-slate-200 p-2.5">
            <div class="flex items-center justify-between gap-2">
              <button
                type="button"
                [routerLink]="['/profile/u-profile',item._id]"
                class="flex min-w-0 items-center cursor-pointer gap-2 rounded-lg px-1 py-1 text-left transition hover:bg-slate-50"
              >
                <img
                  [alt]="item.name"
                  class="h-10 w-10 rounded-full object-cover"
                  [src]="item.photo"
                />
                <div class="min-w-0">
                  <p class="truncate text-sm font-bold text-slate-900 hover:underline">{{item.name}}</p>
                  <p class="truncate text-xs text-slate-500">{{item.username}}</p>
                </div>
              </button>
              <button
                type="button"
                (click)="follow(item)"
                [disabled]="followingId()===item._id"
                class="inline-flex items-center gap-1 rounded-full px-3 py-1.5 text-xs font-bold transition cursor-pointer disabled:cursor-not-allowed disabled:opacity-60 bg-[#e7f3ff] text-[#1877f2] hover:bg-[#d8ebff]"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="13"
                  height="13"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-user-plus"
                  aria-hidden="true"
                >
                  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                  <circle cx="9" cy="7" r="4"></circle>
                  <line x1="19" x2="19" y1="8" y2="14"></line>
                  <line x1="22" x2="16" y1="11" y2="11"></line>
                </svg>
                {{ followingId() === item._id ? 'Following...' : 'Follow' }}
              </button>
            </div>
            <div class="mt-2 flex items-center gap-2 text-[11px] font-semibold text-slate-500">
              <span class="rounded-full bg-slate-100 px-2 py-0.5">{{item.followersCount}} followers</span>
              @if (item.mutualFollowersCount>0) {
                <span span class="rounded-full bg-[#edf4ff] px-2 py-0.5 text-[#1877f2]">{{item.mutualFollowersCount}} mutual</span>
              }
            </div>
          </div>
        }
      </div>
      <button
        routerLink="/sugg-friends"
        class="cursor-pointer mt-3 inline-flex w-full items-center justify-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm font-bold text-slate-700 transition hover:bg-slate-100"
      >
        View more
      </button>
    </div>
  </div>
</aside>
